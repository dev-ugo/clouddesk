name: CloudDesk CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  lint:
    name: Check Python code
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Retrieve repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run --locked ruff check .

      - name: Run tests
        run: uv run --locked python -m pytest

  terraform:
    name: Check Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: infra/terraform

    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Retrieve repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.7"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform for validation
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  security:
    name: Check security
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Retrieve repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
          python-version: "3.13"
          cache-dependency-glob: |
            uv.lock
            .github/security/uv.lock

      - name: Install isolated security tools
        id: tools
        run: uv sync --project .github/security --locked

      - name: Audit locked Python dependencies
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          uv export --locked --all-groups --no-emit-project \
            --format requirements-txt \
            --output-file "$RUNNER_TEMP/clouddesk-requirements.txt"
          uv run --project .github/security --locked pip-audit \
            --requirement "$RUNNER_TEMP/clouddesk-requirements.txt" \
            --require-hashes --disable-pip

      - name: Analyze Python security with Bandit
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          uv run --project .github/security --locked bandit \
            --recursive . --exclude ./.venv,./.github/security/.venv,./tests

      - name: Scan repository files for secrets
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          git ls-files --cached --others --exclude-standard -z | \
            xargs -0 uv run --project .github/security --locked checkov \
              --framework secrets --enable-secret-scan-all-files \
              --compact --skip-download --file

      - name: Check Terraform storage security baseline
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          uv run --project .github/security --locked checkov \
            --directory infra/terraform --framework terraform \
            --external-checks-dir .github/security/checks \
            --check CLOUDDESK_AZURE_1,CKV_AZURE_44,CKV_AZURE_190,CKV2_AZURE_38,CKV2_AZURE_40 \
            --compact --skip-download

  deploy:
    name: Deploy to Azure
    needs: [lint, terraform, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: clouddesk-dev-deployment
      cancel-in-progress: false

    env:
      CLOUDDESK_RG: rg-clouddesk-dev
      CLOUDDESK_APP: app-clouddesk-dev

    steps:
      - name: Retrieve repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create deployment archive
        run: |
          python3 -m zipfile -c "$RUNNER_TEMP/clouddesk.zip" \
            main.py pyproject.toml uv.lock README.md

      - name: Sign in to Azure with OIDC
        uses: azure/login@053f7285eb20bf5469ef084617b0b24d3cec53fc # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        run: |
          az webapp deploy \
            --resource-group "$CLOUDDESK_RG" \
            --name "$CLOUDDESK_APP" \
            --src-path "$RUNNER_TEMP/clouddesk.zip" \
            --type zip \
            --timeout 600000 \
            --track-status false

      - name: Check HTTP health
        run: |
          CLOUDDESK_HOST=$(az webapp show \
            --resource-group "$CLOUDDESK_RG" \
            --name "$CLOUDDESK_APP" \
            --query defaultHostName \
            --output tsv)

          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            "https://${CLOUDDESK_HOST}/health"
