name: CloudDesk CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Check Python code
    runs-on: ubuntu-latest

    steps:
      - name: Retrieve repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run --locked ruff check .

      - name: Run tests
        run: uv run --locked python -m pytest
        
  deploy:
    name: Deploy to Azure
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: clouddesk-dev-deployment
      cancel-in-progress: false

    env:
      CLOUDDESK_RG: rg-clouddesk-dev
      CLOUDDESK_APP: app-clouddesk-dev

    steps:
      - name: Retrieve repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Create deployment archive
        run: |
          python3 -m zipfile -c "$RUNNER_TEMP/clouddesk.zip" \
            main.py pyproject.toml uv.lock README.md

      - name: Sign in to Azure with OIDC
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        run: |
          az webapp deploy \
            --resource-group "$CLOUDDESK_RG" \
            --name "$CLOUDDESK_APP" \
            --src-path "$RUNNER_TEMP/clouddesk.zip" \
            --type zip \
            --timeout 600000 \
            --track-status false

      - name: Check HTTP health
        run: |
          CLOUDDESK_HOST=$(az webapp show \
            --resource-group "$CLOUDDESK_RG" \
            --name "$CLOUDDESK_APP" \
            --query defaultHostName \
            --output tsv)

          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 20 \
            "https://${CLOUDDESK_HOST}/health"